research_interests:
  title: Research Interests
  items:
    - index: "01"
      title: LLM Agents & Long-Horizon Tasks
      description: Agents that plan, call tools, and finish multi-step workflows end to end in executable environments.
    - index: "02"
      title: Recursive Self-Improvement
      description: Memory graphs and reusable skills that let an agent learn from its own past cases without losing reliability.
    - index: "03"
      title: Trustworthy AI & Privacy Auditing
      description: Black-box auditing of what models leak from private context, and how empirical leakage compares to theoretical guarantees.

